<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hacer un pedido | Cookies MJ</title><link rel="stylesheet" href="css/styles.css"><script src="js/main.js" defer></script></head>
<body><div id="site-header"></div><main class="container page"><div class="page-intro"><p class="eyebrow">Algo rico está por llegar</p><h1>Arma tu pedido</h1><p>Completa los datos y prepara tu mensaje para confirmar por WhatsApp.</p></div><form id="order-form" class="form-card"><div class="form-grid"><div class="field"><label for="product">Seleccionar productos</label><select id="product" name="product" required><option value="">Elige un producto</option><option>Galletas clásicas</option><option>Galletas red velvet</option><option>Galletas rellenas</option><option>Galletas doble chocolate</option><option>Galletas Oreo</option><option>Galletas de limón</option><option>Brownies</option><option>Combo / caja</option></select></div><div class="field"><label for="quantity">Cantidad</label><input id="quantity" name="quantity" type="number" min="1" value="1" required></div><div class="field"><label for="custom">Personalización (opcional)</label><input id="custom" name="custom" type="text" placeholder="Ej. mensaje para regalo"></div><div class="field"><label for="date">Fecha de entrega</label><input id="date" name="date" type="date" required></div><div class="field"><label for="time">Hora de entrega</label><select id="time" name="time" required><option value="">Selecciona una hora</option><option>10:00 - 12:00</option><option>12:00 - 14:00</option><option>14:00 - 16:00</option><option>16:00 - 18:00</option></select></div><div class="field"><label for="name">Nombre completo</label><input id="name" name="name" autocomplete="name" required placeholder="Tu nombre"></div><div class="field"><label for="phone">Número de contacto</label><input id="phone" name="phone" inputmode="tel" required pattern="[0-9 +()-]{7,18}" placeholder="Tu número de WhatsApp"></div><div class="field"><label for="address">Dirección de entrega</label><input id="address" name="address" required placeholder="Zona, calle y referencia"></div><div class="field"><label for="payment">Método de pago</label><select id="payment" name="payment" required><option value="">Selecciona un método</option><option>QR</option><option>Transferencia</option><option>Efectivo</option></select></div><div class="field field-full"><label for="notes">Detalles adicionales</label><textarea id="notes" name="notes" rows="3" placeholder="Déjanos alguna indicación"></textarea></div></div><p class="form-note">Tu pedido se confirma cuando coordinemos disponibilidad y entrega por WhatsApp.</p><button class="btn btn-primary" type="submit">Preparar pedido por WhatsApp</button><p id="form-message" class="form-message" role="status"></p></form></main><div id="site-footer"></div></body></html>
